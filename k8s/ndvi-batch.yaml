apiVersion: v1
kind: ConfigMap
metadata:
  name: ndvi-example-input
data:
  ndvi-input.json: "[0.32, 0.48, 0.61]"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ndvi-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ndvi-summary
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: worker
              image: agrosugar/ndvi-worker:1.0.0
              imagePullPolicy: IfNotPresent
              env:
                - name: NDVI_INPUT
                  value: /input/ndvi-input.json
                - name: NDVI_OUTPUT
                  value: /data/results/ndvi-summary.json
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: "1"
                  memory: 512Mi
              volumeMounts:
                - name: ndvi-data
                  mountPath: /data
                - name: ndvi-input
                  mountPath: /input
                  readOnly: true
          volumes:
            - name: ndvi-data
              persistentVolumeClaim:
                claimName: ndvi-data
            - name: ndvi-input
              configMap:
                name: ndvi-example-input
