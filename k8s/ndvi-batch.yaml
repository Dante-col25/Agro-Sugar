apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ndvi-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ndvi-summary
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: worker
              image: agro-sugar/ndvi-worker:local
              imagePullPolicy: IfNotPresent
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: "1"
                  memory: 512Mi
              volumeMounts:
                - name: ndvi-data
                  mountPath: /data
          volumes:
            - name: ndvi-data
              persistentVolumeClaim:
                claimName: ndvi-data
